services:
  database:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу намеренно не публикуется

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Реальные env-переменные перекрывают значения из .env в образе
      APP_ENV: prod
      APP_DEBUG: 0
      # .env.prod в репозитории содержит тестовый APP_SECRET — перекрываем реальным
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}?serverVersion=15&charset=utf8
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
      DB_HOST: database
    volumes:
      - public-data:/var/www/html/public
      - var-data:/var/www/html/var
      - jwt-data:/var/www/html/config/jwt

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - public-data:/var/www/html/public:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
  public-data:
  var-data:
  jwt-data:
